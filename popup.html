<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metrolink to Google Calendar</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <img src="icons/icon48.png" alt="Metrolink to Google Calendar" class="header-logo" />
      <div class="header-titles">
        <h1 class="header-title">Metrolink to Google Calendar</h1>
        <span class="header-version">v1.0.0 • Manifest V3</span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="popup-body">
      <!-- Steps List -->
      <section class="info-card">
        <ol class="steps-list">
          <li class="step-item">
            <span class="step-num">1</span>
            <div class="step-desc">Go to any <strong>Metrolink Schedule</strong> search result.</div>
          </li>
          <li class="step-item">
            <span class="step-num">2</span>
            <div class="step-desc">Click <span class="badge-chip">Details</span> to expand any train trip.</div>
          </li>
          <li class="step-item">
            <span class="step-num">3</span>
            <div class="step-desc">Click the <span class="badge-chip">Add To Calendar</span> button under "Where to Buy".</div>
          </li>
        </ol>
      </section>

      <!-- Action Button -->
      <a href="https://metrolinktrains.com/schedules/" target="_blank" rel="noopener noreferrer" class="btn-primary" id="openSchedulesBtn">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
        Open Metrolink Schedules
      </a>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
